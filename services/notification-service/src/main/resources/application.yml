server:
  port: 8087

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://localhost:5432/notification_db
    username: workhub
    password: workhub

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS:false}

  kafka:
    bootstrap-servers: localhost:9094

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadminpassword}
  bucket-name: ${MINIO_BUCKET_NAME:payslips}

# Configuration pour les services externes
employee-service:
  url: ${EMPLOYEE_SERVICE_URL:http://localhost:8082}

employee:
  organization-id: ${EMPLOYEE_ORGANIZATION_ID:00000000-0000-0000-0000-000000000000}
  default-approver-name: ${EMPLOYEE_DEFAULT_APPROVER:Gestionnaire RH}

management:
  endpoints:
    web:
      exposure:
        include: health,info
