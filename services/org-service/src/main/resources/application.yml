server:
  port: 8081

spring:
  application:
    name: org-service

  datasource:
    url: jdbc:postgresql://localhost:5432/org_db
    username: workhub
    password: workhub

identity:
  service:
    url: ${IDENTITY_SERVICE_URL:http://localhost:8088}


  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info