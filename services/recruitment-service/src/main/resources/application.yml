server:
  port: 8085

spring:
  application:
    name: recruitment-service

  datasource:
    url: jdbc:postgresql://localhost:5432/recruitment_db?stringtype=unspecified
    username: workhub
    password: workhub
  storage:
    minio:
      endpoint: http://localhost:9000
      access-key: minioadmin
      secret-key: minioadminpassword
      bucket: cv-bucket
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: recruitment-group-v2
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.workhub.recruitment.dto.CvAnalysisResult
        spring.json.use.type.headers: false

management:
  endpoints:
    web:
      exposure:
        include: health,info