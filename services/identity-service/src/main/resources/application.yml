server:
  port: 8088
  datasource:
    url: jdbc:postgresql://localhost:5432/identity_db
    username: workhub
    password: workhub

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

spring:
  application:
    name: identity-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:https://feasible-vervet-9.clerk.accounts.dev/.well-known/jwks.json}

clerk:
  webhook:
    secret: ${CLERK_WEBHOOK_SECRET:whsec_placeholder}
