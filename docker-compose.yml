services:
  db:
    image: postgres:15-alpine
    container_name: workhub-db
    environment:
      POSTGRES_USER: workhub_user
      POSTGRES_PASSWORD: workhub_password
      POSTGRES_DB: workhub_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/pg-init/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - workhub-network

  redis:
    image: redis:7-alpine
    container_name: workhub-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - workhub-network

  kafka:
    image: apache/kafka:latest
    container_name: workhub-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - workhub-network

  minio:
    image: minio/minio:latest
    container_name: workhub-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - workhub-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: workhub-backend
    depends_on:
      - db
      - redis
      - kafka
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/workhub_db
      SPRING_DATASOURCE_USERNAME: workhub_user
      SPRING_DATASOURCE_PASSWORD: workhub_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_REDIS_HOST: redis
    ports:
      - "8080:8080"
    networks:
      - workhub-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: workhub-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - workhub-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: workhub-ai
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8000:8000"
    networks:
      - workhub-network

networks:
  workhub-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  minio_data:
